# nginx do PokeIdle Hub (ARCHITECTURE.md §10) — VPS srvsysout.
# Substitua hub.exemplo.com.br pelo domínio real (deploy/install.sh faz isso a partir de HUB_DOMAIN).
# Painel (estáticos do Angular) + API em /api/ + WebSockets /ws (painel) e /bridge (extensão).
# @author André Narcizo - andre.narcizo@sysout.com.br

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream pokeidle_hub_api {
    server 127.0.0.1:3000;
    keepalive 8;
}

# HTTP: só desafio do Let's Encrypt e redirecionamento para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name hub.exemplo.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Forma compatível com nginx < 1.25 (no 1.25+ dá só aviso de obsoleto).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hub.exemplo.com.br;

    ssl_certificate     /etc/letsencrypt/live/hub.exemplo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.exemplo.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:pokeidle_hub_ssl:10m;

    root /var/www/pokeidle-hub/apps/web/dist/web/browser;
    index index.html;

    # Mesmo limite de corpo da API (64 KiB).
    client_max_body_size 64k;

    include /etc/nginx/snippets/pokeidle-hub-headers.conf;

    # API REST: /api/... → http://127.0.0.1:3000/...
    location /api/ {
        proxy_pass http://pokeidle_hub_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets: painel (/ws) e ponte da extensão (/bridge). $http_host preserva a porta, usada
    # pela API para conferir a origem (proteção contra Cross-Site WebSocket Hijacking).
    location ~ ^/(ws|bridge)$ {
        proxy_pass http://pokeidle_hub_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Service worker e índice nunca ficam em cache (atualização do PWA).
    location ~ ^/(index\.html|ngsw-worker\.js|ngsw\.json|safety-worker\.js|manifest\.webmanifest)$ {
        include /etc/nginx/snippets/pokeidle-hub-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Arquivos com hash no nome (main-ABC123.js, media/...): cache longo.
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        include /etc/nginx/snippets/pokeidle-hub-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Rotas do Angular (/, /hunts, /login): volta para o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
