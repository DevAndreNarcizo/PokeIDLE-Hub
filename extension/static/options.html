<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>PokeIdle Hub — Ponte</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #0b0e13;
        color: #e8ecf2;
        font:
          14px/1.5 Inter,
          system-ui,
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 40px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 20px;
      }
      label {
        display: block;
        margin: 16px 0 6px;
        color: #c3ccd9;
        font-size: 12px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        min-height: 44px;
        padding: 0 12px;
        border-radius: 10px;
        border: 1px solid #263042;
        background: #131821;
        color: #e8ecf2;
        font: inherit;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid #8ab4ff;
        outline-offset: 2px;
      }
      button {
        margin-top: 20px;
        min-height: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        background: #f2b53c;
        color: #1a1300;
        font-weight: 600;
        cursor: pointer;
      }
      p.note {
        color: #9aa6b8;
        font-size: 12px;
      }
      #status {
        margin-top: 20px;
        padding: 12px;
        border-radius: 10px;
        background: #1a212c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PokeIdle Hub — Ponte</h1>
      <p class="note">
        Instale esta extensão em cada perfil do Brave (um perfil por conta do jogo) e use o token da
        conta daquele perfil. A extensão só lê a tela do jogo; ela não clica nem digita.
      </p>
      <form id="config">
        <label for="hubUrl">Endereço do hub (ex.: https://hub.seudominio.com.br)</label>
        <input id="hubUrl" name="hubUrl" type="url" required autocomplete="off" />
        <label for="token">Token da ponte desta conta (começa com pih_)</label>
        <input id="token" name="token" type="password" required autocomplete="off" />
        <button type="submit">Salvar e conectar</button>
      </form>
      <div id="status" role="status" aria-live="polite">Carregando…</div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
