# CI do PokeIdle Hub: lint, formatação, typecheck, testes (com PostgreSQL) e build.
# @author André Narcizo - andre.narcizo@sysout.com.br
name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub-ci-only
          POSTGRES_DB: pokeidle_hub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hub" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Credenciais descartáveis do contêiner de CI; não são segredos.
      DATABASE_URL: postgresql://hub:hub-ci-only@localhost:5432/pokeidle_hub_test
      TEST_DATABASE_URL: postgresql://hub:hub-ci-only@localhost:5432/pokeidle_hub_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Migrar banco de teste
        run: npm run db:deploy -w @pokeidle-hub/api

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
